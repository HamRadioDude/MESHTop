; MESHtop (formerly the ScopeThing panel) for the Elecrow CrowPanel Advance 7" (ESP32-S3, V1.3 / V1.4 / V1.5)
[env:crowpanel7]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = ESP32-S3-WROOM-1-N16R8
framework = arduino
monitor_speed = 115200
board_build.arduino.partitions = partitions.csv
board_upload.partitions = partitions.csv
board_build.embed_files = data/x509_crt_bundle
build_unflags = -std=gnu++11 -std=gnu++17
build_flags =
	-std=gnu++2a
	-DLV_CONF_INCLUDE_SIMPLE
	-DSCOPETHING_DEVICE=1
	-DSCOPETHING_VERSION=\"3.1.4\"
	; Name stays MESHtop (2026-11-22: the planned MeshShack rename was cancelled).
	; Keep the "scopething" settings namespace and /scopething SD folder.
	-I include
	-I src
extra_scripts =
	pre:tools/privacy_check.py
	pre:tools/fatfs_exfat.py
lib_deps =
	https://github.com/lvgl/lvgl.git#v9.1.0
	https://github.com/lovyan03/LovyanGFX.git#1.2.26
	https://github.com/bblanchon/ArduinoJson.git#v7.4.2
	https://github.com/Links2004/arduinoWebSockets.git#2.6.1
	https://github.com/tzapu/WiFiManager.git#v2.0.17
	https://github.com/h2zero/NimBLE-Arduino.git#2.3.9
lib_ignore =
	ESPmDNS
	ESP_SR
	Zigbee
	Matter
	RainMaker
	Insights
	WiFiProv
	LittleFS
	ESP_NOW
; Rebuilt ESP-IDF libraries - Espressif's documented fix for RGB-panel drift with Wi-Fi/BLE
; (ESP FAQ "LCD": "use XIP on PSRAM with an RGB Bounce Buffer"):
;  - flash and PSRAM at the standard 80 MHz. 120 MHz octal PSRAM is experimental; on a real panel it
;    caused boot hangs, flash read errors and a deaf Wi-Fi receiver once the board warmed up.
;  - code and read-only data run from PSRAM (XIP), so flash writes (settings, Wi-Fi) no longer stall
;    PSRAM access, and the cache stays enabled for the bounce-buffer interrupt.
; Registry-only add-ons (speech, Zigbee, RainMaker, mDNS...) are left out; ScopeThing uses none.
;  - memory card (v3.0.6): FATFS_USE_FASTSEEK makes jumps inside a big map pack quick, and the
;    rebuild it triggers picks up exFAT, which tools/fatfs_exfat.py switches on in FatFs.
custom_sdkconfig =
	CONFIG_SPIRAM_SPEED_80M=y
	CONFIG_SPIRAM_SPEED_120M=n
	CONFIG_SPIRAM_SPEED=80
	CONFIG_ESPTOOLPY_FLASHFREQ_80M=y
	CONFIG_ESPTOOLPY_FLASHFREQ_120M=n
	CONFIG_IDF_EXPERIMENTAL_FEATURES=n
	CONFIG_SPIRAM_XIP_FROM_PSRAM=y
	CONFIG_SPIRAM_FETCH_INSTRUCTIONS=y
	CONFIG_SPIRAM_RODATA=y
	CONFIG_LCD_RGB_ISR_IRAM_SAFE=n
	CONFIG_ESP32S3_DATA_CACHE_32KB=y
	CONFIG_BT_NIMBLE_MEM_ALLOC_MODE_INTERNAL=n
	CONFIG_BT_NIMBLE_MEM_ALLOC_MODE_EXTERNAL=y
	CONFIG_BT_NIMBLE_MSYS_1_BLOCK_COUNT=32
	CONFIG_BT_NIMBLE_TRANSPORT_ACL_FROM_LL_COUNT=40
	CONFIG_ESP_WIFI_DYNAMIC_RX_BUFFER_NUM=16
	CONFIG_FATFS_USE_FASTSEEK=y
	CONFIG_ESP32S3_DATA_CACHE_LINE_32B=n
	CONFIG_ESP32S3_DATA_CACHE_LINE_64B=y
	CONFIG_ESP32S3_DATA_CACHE_LINE_SIZE=64
custom_component_remove =
	chmorgan/esp-libhelix-mp3
	espressif/cbor
	espressif/cjson
	espressif/dm9051
	espressif/esp-dsp
	espressif/esp-modbus
	espressif/esp-sr
	espressif/esp-zboss-lib
	espressif/esp-zigbee-lib
	espressif/esp_diag_data_store
	espressif/esp_diagnostics
	espressif/esp_hosted
	espressif/esp_insights
	espressif/esp_modem
	espressif/esp_rainmaker
	espressif/esp_wifi_remote
	espressif/ksz8851snl
	espressif/lan867x
	espressif/libsodium
	espressif/mdns
	espressif/network_provisioning
	espressif/qrcode
	espressif/rmaker_common
	espressif/w5500
	joltwallet/littlefs
